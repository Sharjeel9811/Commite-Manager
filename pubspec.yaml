name: committee_manager
description: "Committee Manager - offline-first Bachat Committee / Committee management app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local database
  sqflite: ^2.4.1
  path: ^1.9.0

  # Local notifications
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_timezone: ^5.1.0

  # Formatting
  intl: ^0.20.2

  # Unique ids
  uuid: ^4.5.1

  # Security / auth
  crypto: ^3.0.6
  local_auth: ^2.3.0
  local_auth_android: ^1.0.46
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  supabase_flutter: ^2.8.1

  # Used by the self-hosted OTP gateway transport. A mobile app cannot hold SMTP
  # credentials, so `http` is the only way to reach the Nodemailer server.
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.4
  flutter_lints: ^6.0.0
  image: ^4.10.1
flutter:
  uses-material-design: true
